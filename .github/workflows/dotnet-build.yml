name: .NET Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/ServiceNowUnlockWorkflow/ServiceNowUnlockWorkflow.csproj
      - name: Build
        run: dotnet build src/ServiceNowUnlockWorkflow/ServiceNowUnlockWorkflow.csproj --configuration Release --no-restore
      - name: Test
        run: |
          if (Test-Path src/ServiceNowUnlockWorkflow.Tests/ServiceNowUnlockWorkflow.Tests.csproj) {
            dotnet test src/ServiceNowUnlockWorkflow.Tests/ServiceNowUnlockWorkflow.Tests.csproj --no-build
          } else {
            Write-Host "No tests yet"
          }
        shell: pwsh
